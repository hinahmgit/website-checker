[build]
  command = "npm run build"

[build.environment]
  # These aren't secrets (time zone, public Supabase address, public sign-in key, a flag), but if they're
  # marked secret in Netlify, the secrets scanner flags them wherever the same text appears.
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_TIMEZONE,SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_EMAIL_SIGNIN"
